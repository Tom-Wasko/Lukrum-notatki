<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUKRUM – wnętrza kebaba i dekor, podgląd 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;500&family=PT+Sans:wght@400;700&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
/* LUKRUM – zmienne wyglądu (propozycja do gra/panel_gracza/static/motywy/zmienne.css).
   Wspólne z mapą: --papier, --tusz, --akcent, --akcent-2, --ramka, --font-tekst, --font-szyld.
   Nowa propozycja: --font-gruby (szyld, duże nagłówki, ceny na tablicy, liczby w kartach).
   Zmienne --g-* są tylko dla grafik SVG z tego folderu (skóra, drewno, metal…). */
:root{
  --papier:#e9ede3; --tusz:#1d2721; --akcent:#c2302a; --akcent-2:#2f6f8f; --ramka:#8d978c;
  --font-tekst:'PT Sans','Segoe UI',sans-serif;
  --font-szyld:'Oswald','Arial Narrow',sans-serif;
  --font-gruby:'Alfa Slab One','Rockwell',serif; --gruby-skala:1;
  color-scheme:light;

  --g-karta:color-mix(in srgb,var(--papier) 45%,#fff);
  --g-czern:#1f2421; --g-biel:#f6f4ea;
  --g-skora:#efc7a4; --g-skora2:#c48a66; --g-skora3:#cf9d76; --g-siwy:#c9c7bd; --g-rudy:#a4532a;
  --g-drewno:#6f4a30; --g-drewno2:#b88c5c; --g-metal:#c3c8c4; --g-metal2:#66716c;
  --g-zielen:#5f8f50; --g-zielen2:#3c6238; --g-mieso:#a8552f; --g-szklo:#a9d3de; --g-niebo:#c4e2ea;
  --g-sciana:color-mix(in srgb,var(--papier) 88%,var(--akcent-2));
  --g-sciana2:color-mix(in srgb,var(--papier) 58%,var(--ramka));
  --g-podloga:color-mix(in srgb,var(--papier) 55%,#a39a84);
  --g-podloga2:color-mix(in srgb,var(--papier) 25%,#8d8572);
  --g-tablica:color-mix(in srgb,var(--tusz) 86%,var(--akcent-2));
}
[data-paleta="pewex"]{
  --papier:#efe7d6; --tusz:#2a2118; --akcent:#d4601b; --akcent-2:#1f5c4d; --ramka:#a8957a;
}
[data-motyw="ciemny"]{
  --papier:#121815; --tusz:#e5ebe2; --akcent:#ff5a4e; --akcent-2:#62c3e6; --ramka:#3d4a43;
  color-scheme:dark;

  --g-karta:color-mix(in srgb,var(--papier) 86%,#fff);
  --g-czern:#151917; --g-biel:#e2dfd2;
  --g-skora:#dcb592; --g-skora2:#b07a58; --g-skora3:#b98b66; --g-siwy:#b3b1a8; --g-rudy:#93492a;
  --g-drewno:#553826; --g-drewno2:#93704a; --g-metal:#8b9590; --g-metal2:#4d5753;
  --g-zielen:#4f7a45; --g-zielen2:#33532f; --g-mieso:#96492a; --g-szklo:#5d8ea1; --g-niebo:#1d2e48;
  --g-sciana:color-mix(in srgb,var(--papier) 74%,var(--ramka));
  --g-sciana2:color-mix(in srgb,var(--papier) 40%,var(--ramka));
  --g-podloga:color-mix(in srgb,var(--papier) 62%,#6d6657);
  --g-podloga2:color-mix(in srgb,var(--papier) 45%,#4c473c);
  --g-tablica:color-mix(in srgb,var(--papier) 60%,#000);
}
[data-paleta="pewex"][data-motyw="ciemny"]{
  --papier:#18130e; --tusz:#f2e6d0; --akcent:#ff8a3d; --akcent-2:#52c2a2; --ramka:#4b3f31;
}
/* Gruby krój do porównania (autor jeszcze nie wybrał) */
[data-gruby="rubik"]{ --font-gruby:'Rubik Mono One','Arial Black',sans-serif; --gruby-skala:.8; }

/* ── Układ: pasek z lewej (ikony), pasek u góry, scena 1220×612 dopasowana do okna, na dole pulpit podglądu ── */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--papier);color:var(--tusz);font-family:var(--font-tekst);font-size:15px;line-height:1.4;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;padding-left:58px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--akcent-2);outline-offset:2px}
h1,h2,h3,p{margin:0}
.gruby{font-family:var(--font-gruby);font-weight:400;font-size:calc(1em*var(--gruby-skala))}
.ukryj{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* Pasek z lewej */
.bok{position:fixed;left:0;top:0;bottom:0;width:58px;z-index:30;background:var(--g-tablica);color:var(--g-biel);display:flex;flex-direction:column;
  gap:3px;padding:8px 7px;overflow:hidden;border-right:3px solid var(--tusz);transition:width .16s ease-out}
.bok:hover,.bok.otwarty,.bok:has(:focus-visible){width:218px;box-shadow:6px 0 0 color-mix(in srgb,var(--tusz) 18%,transparent)}
.bok button{display:flex;align-items:center;gap:13px;width:100%;min-width:200px;height:42px;padding:0 10px;border:0;border-radius:6px;background:none;
  font-family:var(--font-szyld);font-size:15px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;text-align:left}
.bok button svg{flex:none;width:24px;height:24px}
.bok button span{opacity:0}
.bok:hover button span,.bok.otwarty button span,.bok:has(:focus-visible) button span{opacity:1}
.bok button:hover{background:color-mix(in srgb,var(--g-biel) 14%,transparent)}
.bok button[aria-current="page"]{background:var(--akcent);color:var(--papier)}
.bok button:focus-visible{outline-color:var(--g-biel);outline-offset:-3px}
.bok .logo{font-family:var(--font-gruby);font-size:calc(19px*var(--gruby-skala));color:var(--akcent);letter-spacing:.03em}
.bok #rozwin svg{transition:transform .16s}
.bok.otwarty #rozwin svg{transform:scaleX(-1)}
.bok .dol{margin-top:auto;display:grid;gap:3px}
.bok hr{border:0;border-top:1px solid color-mix(in srgb,var(--g-biel) 25%,transparent);width:100%;margin:4px 0}
body:has(.bok.otwarty){padding-left:218px}
.osoba.pokaz .dymek{display:block}.osoba.pokaz .znak{visibility:hidden}
@media (prefers-reduced-motion:reduce){.bok,.bok #rozwin svg{transition:none}}

/* Pasek u góry */
.gora{display:flex;align-items:center;gap:22px;min-height:52px;padding:4px 18px;background:var(--g-karta);border-bottom:3px solid var(--tusz)}
.gora h1{font-family:var(--font-gruby);font-weight:400;font-size:calc(21px*var(--gruby-skala));letter-spacing:.01em}
.gora .adres{color:color-mix(in srgb,var(--tusz) 72%,var(--papier));margin-right:auto;font-size:14px}
.gora .wsk{font-family:var(--font-szyld);font-size:13px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.gora .wsk b{font-family:var(--font-gruby);font-weight:400;font-size:calc(19px*var(--gruby-skala));font-variant-numeric:tabular-nums;letter-spacing:0}

/* Scena */
.srodek{min-height:0;display:grid;place-items:center;padding:8px;overflow:hidden}
.scena{position:relative;border:3px solid var(--tusz);border-radius:6px;overflow:hidden;background:var(--g-sciana);font-size:calc(13px*var(--sk,1))}
.scena>svg{display:block;width:100%;height:100%}
.scena text{user-select:none}
.neon{filter:drop-shadow(0 0 2.5px var(--akcent))}
svg[data-mina] .mina{display:none}
svg[data-mina="dobra"] .mina-dobra,svg[data-mina="zwykla"] .mina-zwykla,svg[data-mina="zla"] .mina-zla,svg[data-mina="zmeczona"] .mina-zmeczona{display:inline}
.zastepczy{fill:color-mix(in srgb,var(--papier) 35%,transparent);stroke:var(--tusz);stroke-width:2;stroke-dasharray:9 7;opacity:.75}

@media (prefers-reduced-motion:no-preference){
  .para path{animation:para 3.2s ease-in-out infinite}
  .para path:nth-child(2){animation-delay:1.1s}.para path:nth-child(3){animation-delay:2.1s}.para path:nth-child(4){animation-delay:.6s}
  .neon{animation:neon 7s infinite}
  .wejscie{animation:wejscie .7s ease-out both}
  .sekundnik{animation:obrot 60s steps(60) infinite;transform-origin:1140px 82px}
  .hak{animation:hak 5s ease-in-out infinite alternate;transform-origin:182px 44px}
  .dymek,.karta,.plakat-info{animation:pojaw .18s ease-out both}
}
@keyframes para{0%{opacity:0;transform:translateY(8px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
@keyframes neon{0%,91%,95%,100%{opacity:1}93%{opacity:.45}}
@keyframes wejscie{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes obrot{to{transform:rotate(360deg)}}
@keyframes hak{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes pojaw{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Klikalne miejsca: spokojna przerywana ramka i znaczek „+”; pełna ramka i podpis po najechaniu / fokusie */
.hot{position:absolute;padding:0;background:none;border:.17em dashed var(--akcent-2);border-radius:.5em;z-index:2;background:color-mix(in srgb,var(--akcent-2) 6%,transparent)}
.hot::before{content:"+";position:absolute;right:-.55em;top:-.55em;width:1.35em;height:1.35em;border-radius:50%;background:var(--akcent-2);color:var(--papier);
  border:.12em solid var(--papier);font:700 1em/1.05em var(--font-tekst);text-align:center}
.hot .podpis{position:absolute;left:-.15em;bottom:calc(100% + .25em);background:var(--tusz);color:var(--papier);font-family:var(--font-szyld);font-size:.95em;letter-spacing:.05em;
  text-transform:uppercase;padding:.1em .55em;border-radius:.25em;white-space:nowrap;opacity:0;pointer-events:none}
.hot.podpis-dol .podpis{bottom:auto;top:calc(100% + .25em)}
.hot:hover,.hot:focus-visible{border:.2em solid var(--akcent);background:color-mix(in srgb,var(--akcent) 12%,transparent)}
.hot:hover::before,.hot:focus-visible::before{background:var(--akcent)}
.hot:hover .podpis,.hot:focus-visible .podpis{opacity:1}
.hot:focus-visible{outline:.22em solid var(--tusz);outline-offset:.15em}
.hot.zaznaczony{border:.2em solid var(--akcent)}
.hot .stan{position:absolute;left:-.1em;top:calc(100% + .2em);white-space:nowrap;background:var(--akcent);color:var(--papier);font-family:var(--font-szyld);font-size:.8em;letter-spacing:.04em;text-transform:uppercase;padding:0 .4em;border-radius:.2em}
.hot .stan.jest{background:var(--akcent-2)}

/* Postacie i dymki: dymek tylko po najechaniu albo fokusie */
.osoba{position:absolute;padding:0;border:0;background:none;border-radius:.6em;z-index:3}
.osoba:focus-visible{outline:.22em solid var(--tusz);outline-offset:0}
.osoba .znak{position:absolute;left:50%;top:-1.9em;transform:translateX(-50%);min-width:1.7em;height:1.7em;padding:0 .3em;border-radius:.85em;background:var(--g-karta);color:var(--tusz);
  border:.14em solid var(--tusz);font:700 1em/1.42em var(--font-tekst);text-align:center}
.osoba .znak.wazny{background:var(--akcent);color:var(--papier);border-color:var(--papier)}
.osoba .znak svg{width:1em;height:1em;vertical-align:-.12em}
.dymek{display:none;position:absolute;left:50%;bottom:calc(100% + 2.3em);width:18.5em;margin-left:-9.25em;background:var(--g-karta);color:var(--tusz);border:.15em solid var(--tusz);
  border-left:.5em solid var(--akcent);border-radius:.7em;padding:.5em .75em .6em;text-align:left;font-size:1em;line-height:1.35;box-shadow:.25em .25em 0 color-mix(in srgb,var(--tusz) 28%,transparent);z-index:6}
.dymek.w-lewo{margin-left:-15.5em}.dymek.w-prawo{margin-left:-3em}
.dymek.r-plotki{border-left-color:var(--akcent-2)}.dymek.r-wos,.dymek.r-propozycje{border-left-color:var(--tusz)}
.dymek .kto{display:flex;justify-content:space-between;gap:.6em;font-family:var(--font-szyld);font-size:.95em;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.15em}
.dymek .rodzaj{color:color-mix(in srgb,var(--tusz) 65%,var(--papier));white-space:nowrap}
.dymek .kliknij{display:block;margin-top:.3em;font-weight:700;color:var(--akcent)}
.osoba:hover .dymek,.osoba:focus-visible .dymek{display:block}
.osoba:hover,.osoba:focus-visible{z-index:7}
.osoba:hover .znak,.osoba:focus-visible .znak{visibility:hidden}

/* Karty */
.karta{position:absolute;left:2.5%;top:5%;width:29em;max-height:90%;overflow:auto;background:var(--g-karta);color:var(--tusz);border:.2em solid var(--tusz);border-radius:.5em;
  padding:1em 1.15em 1.1em;box-shadow:.4em .4em 0 var(--tusz);z-index:12;display:grid;gap:.6em}
.karta.z-prawej{left:auto;right:2.5%}
.karta.szeroka{width:44em;top:auto;bottom:4%}
.karta h2{font-family:var(--font-gruby);font-weight:400;font-size:calc(1.5em*var(--gruby-skala));line-height:1.15;padding-right:1.6em}
.karta h3{font-family:var(--font-szyld);font-weight:500;font-size:1.02em;letter-spacing:.05em;text-transform:uppercase}
.karta ul{margin:0;padding-left:1.2em}
.karta .cicho{color:color-mix(in srgb,var(--tusz) 68%,var(--papier));font-size:.93em}
.karta .zamknij{position:absolute;right:.5em;top:.5em;width:2.1em;height:2.1em;border:0;border-radius:.3em;background:none;display:grid;place-items:center}
.karta .zamknij:hover{background:color-mix(in srgb,var(--tusz) 12%,transparent)}
.karta .zamknij svg{width:1.3em;height:1.3em}
.liczby{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5em,1fr));gap:.5em}
.liczby div{border:.12em solid var(--ramka);border-radius:.35em;padding:.3em .55em;font-size:.88em}
.liczby b{display:block;font-family:var(--font-gruby);font-weight:400;font-size:calc(1.55em*var(--gruby-skala));font-variant-numeric:tabular-nums;line-height:1.2}
.btn{border:.14em solid var(--tusz);background:var(--akcent);color:var(--papier);border-radius:.35em;padding:.3em .9em;font-family:var(--font-szyld);font-weight:500;font-size:1.02em;
  letter-spacing:.05em;text-transform:uppercase;justify-self:start}
.btn.drugi{background:none;color:var(--tusz)}
.btn[disabled]{opacity:.5;cursor:default}
.rzad{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.plakietka{display:inline-block;border:.12em solid var(--akcent-2);color:var(--akcent-2);border-radius:1em;padding:0 .6em;font-size:.86em;font-weight:700;white-space:nowrap}
.plakietka.trafia{background:var(--akcent-2);color:var(--papier)}
.pasuje{display:grid;grid-template-columns:1fr auto;gap:.2em .6em;align-items:center;font-size:.93em}
.pasuje .tor{height:.6em;border:.12em solid var(--tusz);border-radius:.3em;overflow:hidden}
.pasuje .tor i{display:block;height:100%;background:var(--akcent-2)}
.seg{border:.14em solid var(--tusz);background:var(--papier);border-radius:.3em;padding:.12em .7em;font-size:.97em}
.seg[aria-pressed="true"]{background:var(--tusz);color:var(--papier)}
.seg[disabled]{opacity:.45;cursor:default}
label.przel{display:flex;gap:.5em;align-items:center}
label.przel input{width:1.1em;height:1.1em;accent-color:var(--akcent)}
.odpowiedzi{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.5em}
.odp{text-align:left;background:var(--papier);border:.14em solid var(--tusz);border-radius:.35em;padding:.4em .6em;display:grid;gap:.3em;align-content:start}
.odp:hover:not([disabled]){background:color-mix(in srgb,var(--akcent) 14%,var(--papier))}
.odp[disabled]{cursor:default;opacity:.55}.odp.wybrana{opacity:1;outline:.2em solid var(--akcent)}
.chip{font-size:.84em;padding:0 .4em;border-radius:.25em;border:.1em solid var(--ramka);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.chip.plus{border-color:var(--akcent-2);color:var(--akcent-2)}.chip.minus{border-color:var(--akcent);color:var(--akcent)}
.pieczatka{justify-self:end;font-family:var(--font-gruby);font-size:calc(1.15em*var(--gruby-skala));text-transform:uppercase;color:var(--akcent);border:.2em double var(--akcent);padding:.05em .5em;transform:rotate(-5deg)}
.zrodlo{border-top:.1em dashed var(--ramka);padding-top:.4em;font-size:.9em}
table.paragon{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.paragon td{padding:.12em 0;border-bottom:.1em dashed var(--ramka)}
table.paragon td:last-child{text-align:right;font-weight:700;white-space:nowrap}
table.paragon tr.suma td{border-bottom:0;font-family:var(--font-gruby);font-size:calc(1.25em*var(--gruby-skala))}
.dekor-grupa{display:grid;gap:.3em;border-top:.1em solid var(--ramka);padding-top:.45em}

/* Informacje na scenie */
.plakat-info{position:absolute;left:50%;top:3%;transform:translateX(-50%);background:var(--g-karta);border:.2em solid var(--tusz);border-radius:.5em;padding:.5em 1em .6em;z-index:4;text-align:center;
  box-shadow:.3em .3em 0 color-mix(in srgb,var(--tusz) 28%,transparent);min-width:24em}
.plakat-info.dol{top:auto;bottom:3%}
.plakat-info h2{font-family:var(--font-gruby);font-weight:400;font-size:calc(1.45em*var(--gruby-skala))}
.postep{display:flex;gap:.35em;margin:.4em 0 .25em}
.postep i{flex:1;height:.9em;border:.14em solid var(--tusz);border-radius:.2em}
.postep i.zrobione{background:var(--akcent-2)}.postep i.teraz{background:repeating-linear-gradient(135deg,var(--akcent) 0 .45em,transparent .45em .9em)}
.toast{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:var(--tusz);color:var(--papier);padding:.45em 1.1em;border-radius:.35em;z-index:14;display:flex;gap:1em;align-items:center}
.toast .btn{border-color:var(--papier)}

/* Pulpit podglądu (to nie jest część gry) */
.pulpit{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:6px 14px 8px;border-top:3px dashed var(--tusz);background:color-mix(in srgb,var(--papier) 80%,var(--ramka));font-size:13.5px}
.pulpit .et{font-family:var(--font-szyld);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.pulpit .grupa{display:flex;align-items:center;gap:4px}
.pulpit .seg{font-size:13.5px;border-width:2px;padding:1px 9px;border-radius:4px}
.pulpit .znaczek{font-family:var(--font-gruby);font-size:calc(13px*var(--gruby-skala));background:var(--tusz);color:var(--papier);padding:2px 9px;border-radius:4px}
</style>

<script>
const DANE = {"bywalcy": [{"id": "rzecki", "imie": "Pan Ignacy Rzecki", "wyglad": "starszy pan w wytartym, ale wyprasowanym garniturze, z grubym zeszytem pod pachą", "rys": "Skrupulatny, pamięta każdą cenę z ostatnich tygodni i zapisuje ją w pamiętniku. Grzeczny, trochę staroświecki.", "dba_o": ["cena_wzgledem_strefy", "zmiana_ceny"], "od_rundy": 1}, {"id": "zagloba", "imie": "Pan Zagłoba", "wyglad": "tęgi, wąsaty, w kamizelce wędkarskiej, z opaską na oku zamiast okularów przeciwsłonecznych", "rys": "Smakosz i gawędziarz. Wszystko porównuje do uczt, które „sam wydawał”. Chwali głośno, gani jeszcze głośniej.", "dba_o": ["ocena", "brak_dan"], "od_rundy": 1}, {"id": "dulska", "imie": "Pani Aniela Dulska", "wyglad": "elegancka pani w płaszczu z futrzanym kołnierzem, z torebką trzymaną jak tarcza", "rys": "Najważniejsze, co ludzie powiedzą. Zna wszystkie plotki z kamienicy i z miasta. Brudy pierze się w domu.", "dba_o": ["ocena", "kolejka"], "od_rundy": 2}, {"id": "judym", "imie": "Doktor Tomasz Judym", "wyglad": "młody lekarz w kurtce narzuconej na fartuch, ze stetoskopem w kieszeni", "rys": "Społecznik. Patrzy na higienę, na zmęczonych pracowników i na to, czy ktoś tu nie jest krzywdzony.", "dba_o": ["nastroj_zespolu", "kolejka"], "od_rundy": 2}, {"id": "papkin", "imie": "Papkin", "wyglad": "chudy elegant w zbyt dużej skórzanej kurtce, z gitarą na plecach zamiast szpady", "rys": "Samochwała, „lew Północy”. Zna wszystkich, zawsze ma interes życia, rzadko ma przy sobie pieniądze.", "dba_o": ["runda"], "od_rundy": 3}, {"id": "jozio", "imie": "Józio", "wyglad": "licealista w za dużej bluzie, z telefonem w ręce, przy nim ciągle ktoś z klasy", "rys": "Boi się, że ktoś mu „przyprawi gębę”. Ocenia, czy lokal jest wstydliwy, czy na czasie. Mówi jak nastolatek.", "dba_o": ["ocena", "cena_wzgledem_strefy"], "od_rundy": 1}, {"id": "wujek", "imie": "Wujek", "wyglad": "starszy pan w kraciastej koszuli i kamizelce, ze zwiniętą gazetą. Ten sam co na zdjęciu przy dawnym barze", "rys": "Prowadził tu kiedyś bar. Mówi krótko, ciepło i trochę z przekąsem. Zawsze wspomina, jak było „za Gierka”.", "dba_o": [], "od_rundy": 1, "specjalny": true}], "dymki": [{"rodzaj": "cena_smak", "kto": "rzecki", "gdy": {"cena_wzgledem_strefy": {"od": 1.15}}, "tekst": "Zapisuję w pamiętniku: porcja po {cena} zł, a w okolicy płaci się {cena_strefy}. Zanotowano z żalem."}, {"rodzaj": "cena_smak", "kto": "rzecki", "gdy": {"zmiana_ceny": {"od": 5}}, "tekst": "W zeszłym tygodniu było taniej o {zmiana_ceny}%. Ja wszystko pamiętam, proszę państwa. Wszystko."}, {"rodzaj": "cena_smak", "kto": "rzecki", "gdy": {"zmiana_ceny": {"do": -5}}, "tekst": "Obniżka! Za mojej pamięci zdarzało się to rzadziej niż kometa. Kupuję dwie porcje, na zapas."}, {"rodzaj": "cena_smak", "kto": "rzecki", "gdy": {"cena_wzgledem_strefy": {"od": 0.9, "do": 1.15}}, "tekst": "Cena uczciwa, porcja uczciwa. Tak się prowadzi sklep. Znaczy… lokal."}, {"rodzaj": "cena_smak", "kto": "zagloba", "gdy": {"ocena": {"od": 4.3}}, "tekst": "Na uczcie u księcia jadłem gorzej, a wierzcie mi, bywałem na niejednej! Mięso jak marzenie!"}, {"rodzaj": "cena_smak", "kto": "zagloba", "gdy": {"ocena": {"do": 3.0}}, "tekst": "Mości kucharzu, toż to podeszwa, nie mięso! Ja bym takim kebabem nie poczęstował nawet Tatarzyna!"}, {"rodzaj": "cena_smak", "kto": "zagloba", "gdy": {"brak_dan": {"od": 0.05}}, "tekst": "Przychodzę głodny jak wilk, a tu „nie ma, skończyło się”! Zapasy, mości panowie, zapasy to podstawa!"}, {"rodzaj": "cena_smak", "kto": "jozio", "gdy": {"cena_wzgledem_strefy": {"od": 1.2}}, "tekst": "Za {cena} zł? Ziomki się ze mnie śmieją, że przepłacam. Nie dam sobie przyprawić gęby frajera."}, {"rodzaj": "cena_smak", "kto": "jozio", "gdy": {"ocena": {"od": 4.0}}, "tekst": "Wrzuciłem story stąd i nikt nie napisał „cringe”. To prawie jak pięć gwiazdek."}, {"rodzaj": "cena_smak", "kto": "dulska", "gdy": {"kolejka": {"od": 0.1}}, "tekst": "Stałam w kolejce jak za mięsem w osiemdziesiątym pierwszym. Co ludzie powiedzą, że ja tu czekam?"}, {"rodzaj": "cena_smak", "kto": "gosc", "gdy": {"cena_wzgledem_strefy": {"od": 1.15}}, "tekst": "Za {cena} zł? U konkurencji dają za {cena_strefy}…"}, {"rodzaj": "cena_smak", "kto": "gosc", "gdy": {"cena_wzgledem_strefy": {"do": 0.85}}, "tekst": "Tak tanio? Coś musi być nie tak z tym mięsem… Ale dobra, biorę."}, {"rodzaj": "cena_smak", "kto": "gosc", "gdy": {"ocena": {"od": 4.2}}, "tekst": "Najlepszy sos w mieście. Mówię to każdemu, kto chce słuchać, i paru, którzy nie chcą."}, {"rodzaj": "cena_smak", "kto": "gosc", "gdy": {"ocena": {"do": 3.0}}, "tekst": "Bułka czerstwa, mięso letnie. Następnym razem idę gdzie indziej."}, {"rodzaj": "cena_smak", "kto": "gosc", "gdy": {"kolejka": {"od": 0.15}}, "tekst": "Dwadzieścia minut w kolejce! Mam przerwę tylko pół godziny."}, {"rodzaj": "cena_smak", "kto": "gosc", "gdy": {"brak_dan": {"od": 0.05}}, "tekst": "Jak to nie ma falafela? Przecież wisi w menu!"}, {"rodzaj": "cena_smak", "kto": "gosc", "tekst": "Poproszę to samo co zawsze. Pani przy ladzie już wie."}, {"rodzaj": "cena_smak", "kto": "judym", "gdy": {"nastroj_zespolu": {"do": 40}}, "tekst": "Pani przy ladzie ledwo stoi na nogach. Jako lekarz mówię: zmęczony pracownik to pomyłki i oparzenia."}, {"rodzaj": "cena_smak", "kto": "judym", "gdy": {"nastroj_zespolu": {"od": 75}}, "tekst": "Uśmiechnięta obsługa to rzadki widok. Widać, że tu się dba o ludzi, nie tylko o utarg."}, {"rodzaj": "cena_smak", "kto": "dulska", "gdy": {"ocena": {"do": 3.0}}, "tekst": "Smakowało średnio, ale nikomu nie powiem. „Na to mamy cztery ściany i sufit, aby brudy swoje prać w domu”."}, {"rodzaj": "cena_smak", "kto": "zagloba", "gdy": {"ocena": {"od": 4.0}}, "tekst": "„Mości panowie! gdybym zaczął wszystko szczegółowie opowiadać, tedy i dziesięciu nocy by nie starczyło”. Krótko: dobry kebab!"}, {"rodzaj": "cena_smak", "kto": "zagloba", "gdy": {"kolejka": {"od": 0.15}}, "tekst": "Tyle czekać na jedną porcję? „Zdechnę ja i pchły moje!”"}, {"rodzaj": "cena_smak", "kto": "papkin", "gdy": {"cena_wzgledem_strefy": {"od": 1.15}}, "tekst": "Za {cena} zł? „Jeśli nie chcesz mojej zguby, krokodyla daj mi, luby”. Albo chociaż rabat."}, {"rodzaj": "cena_smak", "kto": "rzecki", "gdy": {"zmiana_ceny": {"od": 10}}, "tekst": "Ceny rosną jak gwiazda Napoleonów. Ale i ta gwiazda kiedyś zgasła pod Sedanem."}, {"rodzaj": "plotki", "kto": "dulska", "zrodlo": "park", "tekst": "Pani słyszała? W parku {park} ma być „{tytul}”. Ja tam nie pójdę, ale wszyscy będą gadać."}, {"rodzaj": "plotki", "kto": "papkin", "zrodlo": "park", "tekst": "Ja, lew Północy, osobiście biorę udział w „{tytul}” w parku {park}. Załatwię wam tam stoisko. Prawie na pewno."}, {"rodzaj": "plotki", "kto": "gosc", "zrodlo": "kalendarz", "tekst": "Za tydzień {wydarzenie}. Cały Lublin wyjdzie na miasto, przygotujcie więcej mięsa."}, {"rodzaj": "plotki", "kto": "dulska", "zrodlo": "konkurencja", "tekst": "Na {dzielnica} otworzyli nowy kebab, „{konkurent}”. Byłam, oczywiście tylko popatrzeć. Brudno."}, {"rodzaj": "plotki", "kto": "gosc", "zrodlo": "konkurencja", "tekst": "Znajomi chwalą „{konkurent}”. Podobno tańszy. Ja tam zostaję przy was, na razie."}, {"rodzaj": "plotki", "kto": "papkin", "tekst": "Znam szefa największej hurtowni na Tatarach. Powie wam, kiedy mięso stanieje. Za drobną przysługę, rzecz jasna."}, {"rodzaj": "plotki", "kto": "jozio", "tekst": "U nas w szkole mówią, że na Krakowskim to tylko turyści jedzą. Ale my i tak przychodzimy, bo blisko."}, {"rodzaj": "wos", "kto": "jozio", "tekst": "A paragon będzie? Bo mama mówi, że jak nie ma paragonu, to coś jest nie tak.", "wyjasnienie": "Sprzedawca z kasą fiskalną musi przy każdej sprzedaży wydrukować i wydać paragon, nawet gdy klient o niego nie prosi. Za zgodą klienta może to być e-paragon.", "zrodlo_prawne": "ustawa o VAT, art. 111 ust. 3a pkt 1", "sprawdzone": false}, {"rodzaj": "wos", "kto": "zagloba", "tekst": "Czy w tym sosie są orzechy? Mam uczulenie, a wolę zginąć w bitwie niż od sosu.", "wyjasnienie": "Lokal musi informować o 14 alergenach z unijnej listy (m.in. orzechy, gluten, mleko, sezam) także przy daniach bez opakowania, podawanych na miejscu.", "zrodlo_prawne": "rozporządzenie (UE) nr 1169/2011, art. 44 ust. 1 lit. a i załącznik II", "sprawdzone": false}, {"rodzaj": "wos", "kto": "rzecki", "tekst": "Czy ta cena w menu jest z podatkiem? Bo ja liczę co do grosza.", "wyjasnienie": "Cena dla klienta zawsze zawiera VAT (jest brutto). Klient płaci dokładnie tyle, ile widzi w menu.", "zrodlo_prawne": "ustawa z 9 maja 2014 r. o informowaniu o cenach towarów i usług, art. 3 ust. 1 pkt 1", "sprawdzone": false}, {"rodzaj": "wos", "kto": "gosc", "tekst": "Kebab był zimny. Mogę to zareklamować, czy już po ptakach?", "wyjasnienie": "Można złożyć reklamację. Firma ma 14 dni od jej otrzymania na odpowiedź. Jeśli nie odpowie w terminie, uznaje się, że reklamację przyjęła.", "zrodlo_prawne": "ustawa o prawach konsumenta, art. 7a", "sprawdzone": false}, {"rodzaj": "wos", "kto": "jozio", "tekst": "Mam szesnaście lat. Mogę tu dorobić w wakacje?", "wyjasnienie": "Tak, ale tylko przy lekkich pracach i po badaniu lekarskim. W wakacje najwyżej 7 godzin dziennie i 35 w tygodniu, bez nadgodzin i nie w nocy (22–6).", "zrodlo_prawne": "Kodeks pracy, art. 200¹, 200², 201 i 203", "sprawdzone": false}, {"rodzaj": "wos", "kto": "judym", "tekst": "Widzę kamerę nad kasą. Pracownicy wiedzą, że są nagrywani?", "wyjasnienie": "Muszą wiedzieć. Pracodawca informuje o monitoringu najpóźniej 2 tygodnie przed jego uruchomieniem, określa jego cel i oznacza nagrywany teren.", "zrodlo_prawne": "Kodeks pracy, art. 22² i RODO (art. 13)", "sprawdzone": false}, {"rodzaj": "wos", "kto": "gosc", "tekst": "Płacę kartą, dobrze? Nie mam przy sobie gotówki.", "wyjasnienie": "Firma musi dać klientowi możliwość zapłaty bezgotówkowej, np. kartą albo BLIK-iem. Od 2025 r. kasa fiskalna musi być połączona z terminalem płatniczym.", "zrodlo_prawne": "Prawo przedsiębiorców, art. 19a (ust. 1 od 2022 r., ust. 3 od 2025 r.)", "sprawdzone": false}, {"rodzaj": "wos", "kto": "papkin", "tekst": "Zapłacę jutro, słowo lwa Północy! Albo zapiszcie mi to na zeszyt.", "wyjasnienie": "„Na zeszyt” to odroczona płatność, czyli kredyt dla klienta. Ryzyko, że pieniądze nie wrócą, ponosi sprzedawca, a sprzedaż i tak trzeba zarejestrować na kasie w chwili wydania jedzenia.", "zrodlo_prawne": "Kodeks cywilny, art. 535 (umowa sprzedaży); ustawa o VAT, art. 111 (ewidencja na kasie)", "sprawdzone": false}, {"rodzaj": "cena_smak", "kto": "wujek", "okazja": "start", "tekst": "No to klucze są wasze. Za Gierka kolejka stała do samego rogu. Zobaczymy, ile wy postoicie."}, {"rodzaj": "cena_smak", "kto": "wujek", "okazja": "pierwsza_strata", "tekst": "Pierwszy tydzień na minusie? Ja miałem takich dziesięć z rzędu. Głowa do góry i liczyć, liczyć."}, {"rodzaj": "cena_smak", "kto": "wujek", "okazja": "rekord", "tekst": "Taki utarg? Za moich czasów to by mi milicja przyszła sprawdzić, skąd tyle. Gratuluję, naprawdę."}, {"rodzaj": "cena_smak", "kto": "wujek", "okazja": "ostatnia_runda", "tekst": "Ostatni tydzień. Cokolwiek wyjdzie w rachunkach, lokal żyje. A to więcej, niż ja potrafiłem."}], "propozycje": [{"id": "catering_umcs", "kto": "gosc", "od_rundy": 3, "tekst": "Dzień dobry, jestem z samorządu studentów UMCS. Catering na 120 osób w piątek, damy radę? Płacimy przelewem.", "odpowiedzi": [{"id": "tak", "tekst": "Bierzemy, po cenie z menu.", "reakcja": "Super! To w piątek o 18:00 pod Chatką Żaka.", "skutki": {"porcje": 120, "opinia": 0.05, "ryzyko_kontroli": 0.05}}, {"id": "rabat", "tekst": "Bierzemy, z rabatem 15% za dużą ilość.", "reakcja": "Z rabatem? To biorę od razu i polecę was na grupie roku.", "skutki": {"porcje": 120, "rabat": 0.15, "opinia": 0.1, "ryzyko_kontroli": 0.05}}, {"id": "odmowa", "tekst": "Nie damy rady, kuchnia jest za mała.", "reakcja": "Szkoda. To zamówimy pizzę.", "skutki": {}}]}, {"id": "kapela_papkina", "kto": "papkin", "od_rundy": 3, "tekst": "Przyprowadzę wam całą kapelę po koncercie! Tylko pierwsza kolejka na koszt f     case 'ekipa': return `<h2 id="k-tytul">Ekipa remontowa</h2><p>Malują, kładą instalacje i podłogę. Adaptacja to jednorazowy koszt i jedna runda bez sprzedaży.</p>${liczby([['Zostało', '1 runda']])}`;
    case 'budowa': return `<h2 id="k-tytul">Plac budowy</h2><p>Budowa trwa ${DZIALKA.rund} rundy. W tym czasie nie sprzedajesz, ale płacisz raty.</p>
      ${liczby([['Runda', stan.budowa + ' z ' + DZIALKA.rund], ['Zapłacono', zl(DZIALKA.koszt/DZIALKA.rund*stan.budowa) + ' zł'], ['Całość', zl(DZIALKA.koszt) + ' zł']])}`;
    case 'raty': return `<h2 id="k-tytul">Raty budowy</h2><p>Koszt budowy płacisz w równych ratach, co rundę.</p>${liczby([['Rata', zl(DZIALKA.koszt/DZIALKA.rund) + ' zł'], ['Rat', DZIALKA.rund]])}<button class="btn">Finanse</button>`;
    case 'projekt': return `<h2 id="k-tytul">Projekt lokalu</h2><p>Własny budynek jest duży: zmieści 5 stanowisk kuchni i 3 kasy. Sprzęt i dekor kupisz po otwarciu.</p>`;
    case 'finanse': return kartaMiejsca('kasa');
    case 'mapa': return `<h2 id="k-tytul">Mapa Lublina</h2><p>Tu wracasz na mapę miasta. Wyjście jest natychmiastowe, bez animacji.</p>`;
  }
  return '';
}
function kartaUstawien(){
  const seg = (klucz, pary) => `<div class="rzad">${pary.map(([w, n]) => `<button class="seg" data-ust="${klucz}:${w}" aria-pressed="${stan[klucz] === w}">${n}</button>`).join('')}</div>`;
  const filtr = (k, wylaczone) => RODZAJE.map(([r, n]) => `<label class="przel"><input type="checkbox" data-filtr="${k}:${r}" ${stan[k][r] ? 'checked' : ''} ${wylaczone && !stan.mg[r] ? 'disabled' : ''}> ${n}</label>`).join('');
  return `<h2 id="k-tytul">Ustawienia</h2>
    <h3>Paleta</h3>${seg('paleta', [['bar', 'Bar mleczny'], ['pewex', 'Pewex']])}
    <h3>Tryb</h3>${seg('motyw', [['jasny', 'Jasny'], ['ciemny', 'Ciemny']])}
    <h3>Gruby krój (do wyboru przez autora)</h3>${seg('gruby', [['alfa', 'Alfa Slab One'], ['rubik', 'Rubik Mono One']])}
    <p class="cicho">Gruby krój jest tylko w szyldzie, dużych nagłówkach, cenach na tablicy i liczbach w kartach. Reszta to Oswald i PT Sans.</p>
    <h3>Moje dymki</h3><div>${filtr('gr', true)}</div>
    <h3>Mistrz gry (dla całej klasy)</h3><div>${filtr('mg', false)}</div>`;
}
function kartaWos(d){
  return `<h2 id="k-tytul">Jak to jest z prawem?</h2><p class="cicho">„${esc(wypelnij(d.tekst, SCEN[stan.tydzien]))}”</p><p>${esc(d.wyjasnienie || '')}</p>
    <div class="zrodlo"><b>Podstawa:</b> ${esc(d.zrodlo_prawne || '')}</div>${d.sprawdzone ? '' : '<p class="cicho">Tekst czeka na zatwierdzenie autora.</p>'}`;
}
function kartaPropozycji(d, nazwa){
  const p = d.prop;
  return `<h2 id="k-tytul">Propozycja: ${esc(nazwa)}</h2><p>„${esc(p.tekst)}”</p><p class="cicho">Odpowiada cała drużyna. Skutek liczy się w tej rundzie.</p>
    <div class="odpowiedzi">${p.odpowiedzi.map(o => `<button class="odp${stan.odpowiedz === o.id ? ' wybrana' : ''}" data-odp="${o.id}" ${stan.odpowiedz ? 'disabled' : ''}>
      <span>${esc(o.tekst)}</span><span class="rzad" style="gap:.25em">${opisSkutkow(o.skutki, o.szansa)}</span></button>`).join('')}</div>
    ${stan.odpowiedz ? '<div class="pieczatka">Zatwierdzono</div>' : ''}`;
}
function pokazKarte(k){
  stan.karta = k;
  const [rodzaj, a, b] = k.split(':');
  if(rodzaj === 'towar') return karta(kartaTowaru(a, b), Object.keys(DEKOR).indexOf(a) < 2 ? 'z-prawej' : '');
  if(rodzaj === 'kasa-sklep') return karta(kartaKasy());
  if(rodzaj === 'dekor') return karta(kartaDekoru(), 'z-prawej');
  if(rodzaj === 'ustawienia') return karta(kartaUstawien(), 'z-prawej');
  if(rodzaj === 'osoba'){ const o = osoby[+a]; if(!o || !o.d) return zamknijKarte();
    return o.d.prop ? karta(kartaPropozycji(o.d, o.nazwa), 'szeroka') : o.d.rodzaj === 'wos' ? karta(kartaWos(o.d), 'z-prawej') : (stan.karta = null, karta('')); }
  const html = kartaMiejsca(rodzaj);
  karta(html, ['kuchnia', 'ludzie', 'lada', 'kasa', 'finanse', 'menu', 'kasjerka', 'kucharz', 'sprzet', 'menu0', 'ludzie0', 'raty', 'mapa'].includes(rodzaj) ? '' : 'z-prawej');
}

/* ── Rysowanie całości ── */
function toast(t, przycisk){ $('toast-miejsce').innerHTML = `<div class="toast"><span>${t}</span>${przycisk || ''}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $('toast-miejsce').innerHTML = '', 6000); }
function rysuj(){
  H.dataset.motyw = stan.motyw; H.dataset.paleta = stan.paleta; H.dataset.gruby = stan.gruby;
  const sklep = stan.widok === 'sklep', L = lokal(), sc = SCEN[stan.tydzien];
  const w = sklep ? scenaSklepu() : stan.stan === 'budowa' ? scenaBudowy() : stan.stan === 'surowy' ? scenaSurowa() : scenaLokalu();
  if(sklep || poziom() === 0) osoby = [];
  $('svg').innerHTML = w.s; $('svg').setAttribute('aria-label', w.opis);
  let h = w.h;
  if(!sklep && poziom()) h += hot('kasjerka', 'Kasia: karta pracownika', 742, 204, 66, 74) + hot('kucharz', 'Bartek: karta pracownika', 866, 196, 68, 100);
  $('nakladka').innerHTML = h;
  $('g-nazwa').textContent = sklep ? 'Sklep meblowy' : poziom() ? 'Kebab „U Wujka”' : L.nazwa;
  $('g-adres').textContent = sklep ? 'Park handlowy, LSM i Czuby · kupujesz do: ' + L.nazwa : `${poziom() ? L.nazwa + ', ' : ''}${L.adres} · ${L.strefa}`;
  $('g-tydzien').textContent = sc.runda + ' z 8'; $('g-kasa').textContent = sc.kasa + ' zł'; $('g-ocena').textContent = poziom() ? sc.ocena + ' ★' : '–';
  const akt = sklep ? 'sklep' : 'lokal';
  $('bok-pozycje').innerHTML = BOK.map(([id, n]) => `<button data-bok="${id}" aria-label="${n}" ${id === akt ? 'aria-current="page"' : ''}>${ik(id)}<span>${n}</span></button>`).join('');
  const seg = (el, pary, klucz, wyl) => $(el).innerHTML = pary.map(([w, n]) => `<button class="seg" data-p="${klucz}:${w}" aria-pressed="${String(stan[klucz]) === String(w)}" ${wyl ? 'disabled' : ''}>${n}</button>`).join(' ');
  seg('p-widok', [['lokal', 'Lokal'], ['sklep', 'Sklep meblowy']], 'widok');
  seg('p-typ', [['kamienica', 'Kamienica, Stare Miasto'], ['pawilon', 'Pawilon, LSM'], ['dworzec', 'Przy dworcu']], 'typ', stan.stan === 'budowa' && !sklep);
  seg('p-stan', STANY, 'stan', sklep);
  seg('p-budowa', [[1, '1'], [2, '2'], [3, '3'], [4, '4']], 'budowa'); $('p-budowa-g').style.display = stan.stan === 'budowa' && !sklep ? '' : 'none';
  seg('p-tydzien', Object.entries(SCEN).map(([t, s]) => [t, `${t}: ${s.opis}`]), 'tydzien', sklep || !poziom());
  if(stan.karta) pokazKarte(stan.karta);
  if(window.pokazDymek != null){ const o = document.querySelector(`[data-osoba="${window.pokazDymek}"]`); if(o) o.classList.add('pokaz'); }
}
$('bok-dol').innerHTML = BOK_DOL.map(([id, n]) => `<button data-bok="${id}" aria-label="${n}">${ik(id)}<span>${n}</span></button>`).join('');

/* ── Zdarzenia ── */
function fokusPo(sel){ const el = document.querySelector(sel); if(el) el.focus({preventScroll:true}); }
document.addEventListener('click', e => {
  const t = e.target.closest('button, input'); if(!t) return;
  const d = t.dataset;
  if(t.id === 'rozwin'){ const o = $('bok').classList.toggle('otwarty'); t.setAttribute('aria-expanded', o); t.setAttribute('aria-label', o ? 'Zwiń pasek' : 'Rozwiń pasek z nazwami'); return; }
  if(t.classList.contains('zamknij')) return zamknijKarte();
  if(d.bok){
    otwieracz = `[data-bok="${d.bok}"]`;
    if(d.bok === 'lokal' || d.bok === 'sklep'){ stan.widok = d.bok; stan.karta = null; karta(''); rysuj(); return fokusPo(otwieracz); }
    if(poziom() === 0 && stan.widok === 'lokal' && ['menu', 'kuchnia', 'ludzie', 'finanse', 'dekor'].includes(d.bok)){ stan.karta = null; karta(''); return toast('Najpierw dokończ lokal. Potem otworzy się: ' + t.getAttribute('aria-label') + '.'); }
    return pokazKarte(d.bok);
  }
  if(d.hot){ otwieracz = `[data-hot="${d.hot}"]`; return pokazKarte(d.hot); }
  if(d.osoba){ otwieracz = `[data-osoba="${d.osoba}"]`; return pokazKarte('osoba:' + d.osoba); }
  if(d.karta) return pokazKarte(d.karta);
  if(d.idz){ stan.widok = d.idz; stan.karta = null; karta(''); return rysuj(); }
  if(d.p){ const [k, w] = d.p.split(':'); stan[k] = k === 'budowa' || k === 'tydzien' ? +w : w;
    if(k !== 'widok') { stan.karta = null; karta(''); } if(k === 'tydzien'){ stan.odpowiedz = null; stan.wynikSzansy = null; }
    rysuj(); return fokusPo(`[data-p="${d.p}"]`); }
  if(d.ust){ const [k, w] = d.ust.split(':'); stan[k] = w; rysuj(); return fokusPo(`[data-ust="${d.ust}"]`); }
  if(d.filtr){ const [k, r] = d.filtr.split(':'); stan[k][r] = t.checked; rysuj(); return fokusPo(`[data-filtr="${d.filtr}"]`); }
  if(d.uzyj){ const [g, s] = d.uzyj.split(':'); stan.dekor[g] = s; rysuj(); return fokusPo(`[data-uzyj="${d.uzyj}"]`); }
  if(d.wozek){ const [g, s] = d.wozek.split(':'); const i = stan.wozek.findIndex(w => w[0] === g && w[1] === s);
    if(i >= 0) stan.wozek.splice(i, 1); else stan.wozek.push([g, s]); rysuj(); return fokusPo(`[data-wozek="${d.wozek}"]`); }
  if(d.zaplac){ stan.wozek.forEach(([g, s]) => { stan.kupione[g].push(s); stan.dekor[g] = s; }); const ile = stan.wozek.length; stan.wozek = []; stan.karta = null; karta(''); rysuj();
    return toast(`Kupione (${ile}). Dekor jest już w lokalu.`, '<button class="btn" data-idz="lokal">Zobacz w lokalu</button>'); }
  if(d.odp && !stan.odpowiedz){ stan.odpowiedz = d.odp; const p = DANE.propozycje.find(p => p.id === SCEN[stan.tydzien].propozycja), o = p && p.odpowiedzi.find(x => x.id === d.odp);
    stan.wynikSzansy = o && o.szansa != null ? losowy(stan.tydzien*31)() < o.szansa : null; rysuj(); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if(stan.karta) zamknijKarte(); else { $('bok').classList.remove('otwarty'); $('rozwin').setAttribute('aria-expanded', false); } } });

/* Stan startowy z adresu (#typ=pawilon&stan=z3&motyw=ciemny&karta=menu…), przydatne do zrzutów */
new URLSearchParams(location.hash.slice(1)).forEach((w, k) => {
  if(k === 'dekor'){ Object.keys(stan.dekor).forEach(g => { stan.dekor[g] = w; if(w !== 'podstawowy') stan.kupione[g].push(w); }); }
  else if(k === 'rozwin') $('bok').classList.add('otwarty');
  else if(k === 'dymek') window.pokazDymek = w;
  else if(k === 'wozek') w.split(',').forEach(x => stan.wozek.push(x.split('.')));
  else if(k in stan) stan[k] = k === 'budowa' || k === 'tydzien' ? +w : w;
});
if(!location.hash.includes('motyw') && matchMedia('(prefers-color-scheme: dark)').matches) stan.motyw = 'ciemny';

const srodek = $('srodek'), scenaEl = $('scena');
new ResizeObserver(() => { const W = srodek.clientWidth - 16, Hh = srodek.clientHeight - 16, w = Math.max(320, Math.min(W, Hh*1220/612));
  scenaEl.style.width = w + 'px'; scenaEl.style.height = w*612/1220 + 'px'; scenaEl.style.setProperty('--sk', (w/1220).toFixed(4)); }).observe(srodek);
rysuj();
</script>
</body>
</html>
